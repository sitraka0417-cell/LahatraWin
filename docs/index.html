<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lahatra : connexion Google</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0F3D3E,#1C6B62);color:#17211F;font-family:"Segoe UI",system-ui,sans-serif;padding:16px}
  .c{background:#fff;border-radius:28px;padding:40px 44px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  h1{margin:14px 0 6px;font-family:Georgia,serif;font-size:28px;color:#0F3D3E} p{margin:0 0 22px;color:#5C6663;line-height:1.5}
  button{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:46px;padding:0 24px;border-radius:23px;background:#fff;color:#1F1F1F;border:1px solid #747775;font:500 15px Roboto,"Segoe UI",sans-serif;cursor:pointer;width:100%}
  button:hover{box-shadow:0 1px 3px rgba(60,64,67,.3);background:#F8FAFD} button:disabled{opacity:.6;cursor:default}
  #msg{margin-top:18px;font-size:14px;color:#BA1A1A;min-height:1.3em}
  svg.g{width:20px;height:20px}
</style>
</head>
<body>
<div class="c">
  <svg width="64" height="64" viewBox="0 0 108 108"><rect x="4" y="4" width="100" height="100" rx="26" fill="#0F3D3E"/><g stroke="#F6F3EE" stroke-width="6" stroke-linecap="round" fill="none"><path d="M52,40 L78,40"/><path d="M52,54 L78,54"/><path d="M52,68 L68,68"/></g><g stroke="#F2A541" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M29,40 L33.5,44.5 L41,35.5"/><path d="M29,54 L33.5,58.5 L41,49.5"/><circle cx="35.5" cy="68" r="5.5" stroke-width="4"/></g></svg>
  <h1>Lahatra</h1>
  <p>Connectez-vous avec votre compte Google pour synchroniser vos tâches avec l'application Windows.</p>
  <button id="btn"><svg class="g" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Se connecter avec Google</span></button>
  <div id="msg"></div>
</div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

  const app = initializeApp({
    apiKey: 'AIzaSyCZomekYtmwI5EosNFyyB9Mve2tJs3QYqM',
    authDomain: 'lahatra-7be8b.firebaseapp.com',
    projectId: 'lahatra-7be8b'
  });
  const auth = getAuth(app);
  const q = new URLSearchParams(location.search);
  const port = q.get('port');
  const state = q.get('state');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  if (port !== '8766' || !state) {
    btn.disabled = true;
    msg.textContent = "Ouvrez cette page depuis l'application Lahatra.";
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true; msg.textContent = '';
    try {
      const res = await signInWithPopup(auth, new GoogleAuthProvider());
      const cred = GoogleAuthProvider.credentialFromResult(res);
      if (!cred || !cred.idToken) throw new Error('Jeton Google introuvable');
      location.href = 'http://127.0.0.1:' + port + '/callback?state=' + encodeURIComponent(state) +
        '&id_token=' + encodeURIComponent(cred.idToken);
    } catch (e) {
      btn.disabled = false;
      msg.textContent = 'Échec : ' + (e.code || e.message);
    }
  });
</script>
</body>
</html>
